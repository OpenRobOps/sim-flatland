name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/openrobops/flatland-nav2:latest

      # The ISO 21423 SDK repo is private: ISO_SDK_READ_TOKEN is a fine-grained PAT with read access to it (same secret ORO's CI uses).
      - uses: actions/checkout@v7
        with:
          repository: OpenRobOps/iso21423
          token: ${{ secrets.ISO_SDK_READ_TOKEN }}
          path: iso21423

      - uses: docker/build-push-action@v7
        with:
          context: ./iso-agent
          build-contexts: iso21423=./iso21423
          push: true
          tags: ghcr.io/openrobops/flatland-iso-agent:latest
