name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/openrobops/flatland-nav2:latest

      - uses: actions/checkout@v7
        with:
          repository: OpenRobOps/iso21423
          path: iso21423

      - uses: docker/build-push-action@v7
        with:
          context: ./iso-agent
          build-contexts: iso21423=./iso21423
          push: true
          tags: ghcr.io/openrobops/flatland-iso-agent:latest
