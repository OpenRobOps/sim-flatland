# Robot footprint for the flatland simulation, applied fleet-wide (metadata.id: system). The sim's
# physics body is a 0.22 m circle, but nav2 plans with a 0.44 x 0.28 m rectangle
# (config/nav2_params.yaml `footprint`), so that is what we draw: a rounded rectangle (0.06 m
# corners, 20 points) in the robot frame (+x forward), metres. Profile-independent:
#
#   inorbit apply -f oro-config/footprint.yaml
#
# ISO robots also report their own outline in the identity's imrFootprint (the same shape, see
# iso-agent/src/mapping.js FLATLAND_FOOTPRINT); a configured RobotFootprint (system or per-robot)
# overrides it. Same spec shape as InOrbit's RobotFootprint.
apiVersion: v0.1
kind: RobotFootprint
metadata:
  id: system
  scope: ""
spec:
  footprint:
    - {x: 0.16, y: -0.14}
    - {x: 0.183, y: -0.1354}
    - {x: 0.2024, y: -0.1224}
    - {x: 0.2154, y: -0.103}
    - {x: 0.22, y: -0.08}
    - {x: 0.22, y: 0.08}
    - {x: 0.2154, y: 0.103}
    - {x: 0.2024, y: 0.1224}
    - {x: 0.183, y: 0.1354}
    - {x: 0.16, y: 0.14}
    - {x: -0.16, y: 0.14}
    - {x: -0.183, y: 0.1354}
    - {x: -0.2024, y: 0.1224}
    - {x: -0.2154, y: 0.103}
    - {x: -0.22, y: 0.08}
    - {x: -0.22, y: -0.08}
    - {x: -0.2154, y: -0.103}
    - {x: -0.2024, y: -0.1224}
    - {x: -0.183, y: -0.1354}
    - {x: -0.16, y: -0.14}
  radius: 0.14
  primaryColor: "#2A3C98"
  secondaryColor: "#CCCCCC"
