#######################################################################################
## ModuleState
#######################################################################################
# CustomDataAgentlet: Startup defaults are fine
# RosMapAgentlet, RosPoseAgentlet: Startup defaults are fine (just runlevel)
# RosImageAgentlet: Startup defaults should be fine (to be tested - flatland does not have images)
# RosLocalizationAgentlet: This is where most flatland topics need to be configured. Also enable it by default, runLevel 5 (it is the default, don't forget to keep this setting)
apiVersion: v0.1
kind: ModuleState
metadata:
  id: RosLocalizationAgentlet
  scope: ''
spec:
  state:
    minRunlevel: 5
    map_topic: "map"
    nav_goal_topic: "goal_pose"
    laser_topic: "scan"
    costmap_topic: "local_costmap/costmap"
    set_pose_topic: "flatland_0/initialpose"
    path_topics: 
     "0": { "topic": "plan"}
---
# RosDiagnosticsAgentlet: Enable it (runlevel 5) so the agent forwards /diagnostics_agg.
# Required for ROS Diagnostics key-values to reach ORO and map to attributes
# (see the nav2Health DataSource above).
apiVersion: v0.1
kind: ModuleState
metadata:
  id: RosDiagnosticsAgentlet
  scope: ''
spec:
  state:
    minRunlevel: 5
---
# RosTeleopAgentlet: Set the cmd_vel topic
apiVersion: v0.1
kind: ModuleState
metadata:
  id: RosTeleopAgentlet
  scope: ''
spec:
  state:
    publish_zero_vel: true
    cmd_vel_topic: "flatland_0/cmd_vel"
---
# RosImageAgentlet: Set the image topic
apiVersion: v0.1
kind: ModuleState
metadata:
  id: RosImageAgentlet
  scope: ''
spec:
  state:
    camera_topics:
      0: "image_raw/compressed"
    cameraViewOn: true
    cameras_config:
      0:
        topic: "image_raw/compressed"
        output_encoding: 'mono8'
        quality: 50
        rate: 2
        img_width: 320
        img_height: 240
        is_on: true
---
#######################################################################################
## Battery status thresholds + incident
#######################################################################################
# Status thresholds on the battery percentage attribute. The ingest status engine
# evaluates battery_percentage and raises a warning/error alert that carries the
# evaluated value, so the incident's Data column shows the percentage (e.g. "12%").
# The ERROR rule is listed first on purpose: the evaluator stops at the first
# matching rule, so the stricter threshold must come first or a critical reading
# would be reported as a warning.
apiVersion: v0.1
kind: StatusDefinition
metadata:
  id: batteryPercentage
  scope: ''
spec:
  rules:
  # Thresholds are on the stored 0..1 fraction (0.08 = 8%, 0.20 = 20%).
  - function: BELOW
    params: [0.15]
    status: ERROR
  - function: BELOW
    params: [0.30]
    status: WARNING
---
# Incident definition keyed to the battery percentage attribute (the triggerId).
# As the battery drains the incident escalates: a low-battery warning offers the
# operator a manual dock action; a critical error docks the robot automatically;
# on recovery the battery is reset.
apiVersion: v0.1
kind: IncidentDefinition
metadata:
  id: batteryPercentage
  scope: ''
spec:
  label: Battery low
  labelTemplate: '{{robotName}}: battery low'
  warning:
    severity: SEV 2
    manualActions:
    - DockAuto
  error:
    severity: SEV 0
    autoActions:
    - DockAuto
---
# Status on the navigation activity value (see the navigationActivity
# DataSource): the watcher's WARN/stale messages carry "(threshold ...)"
# or say "no message received yet" (strings from diagnostics_watcher's
# status_logic.py — keep them in sync); anything else means cmd_vel is
# fresh, i.e. the robot is navigating, and evaluates to OK.
apiVersion: v0.1
kind: StatusDefinition
metadata:
  id: navigationActivity
  scope: ''
spec:
  rules:
  - function: CONTAINS
    params: ["threshold"]
    status: WARNING
  - function: CONTAINS
    params: ["no message"]
    status: WARNING
---
# Status on the echoed message: 'error' and 'warning' values raise the
# corresponding status; any other message is OK. The ERROR rule is listed
# first because the evaluator stops at the first matching rule.
apiVersion: v0.1
kind: StatusDefinition
metadata:
  id: message
  scope: ''
spec:
  rules:
  - function: EQUALS
    params: ["error"]
    status: ERROR
  - function: EQUALS
    params: ["warning"]
    status: WARNING
---
apiVersion: v0.1
kind: IncidentDefinition
metadata:
  id: message
  scope: ''
spec:
  label: Message
  warning:
    severity: SEV 2
  error:
    severity: SEV 1
