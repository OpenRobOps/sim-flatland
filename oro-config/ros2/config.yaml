#######################################################################################
## DataSourceDefinition                             
#######################################################################################
apiVersion: v0.1
kind: DataSourceDefinition
metadata:
  id: batteryPercentage
  scope: ""
spec:
  label: Battery Percentage
  # Values arrive as a 0..1 fraction; unit '%' makes ORO display them as a
  # percentage (the formatter multiplies by 100), so 0.12 shows as "12%".
  unit: '%'
  precision: 0
  source:
    keyValue:
      key: "battery_percentage"
  timeline: {}
---
apiVersion: v0.1
kind: DataSourceDefinition
metadata:
  id: batteryVoltage
  scope: ""
spec:
  label: Battery Voltage
  source:
    keyValue:
      key: "battery_voltage"
  timeline: {}
---
apiVersion: v0.1
kind: DataSourceDefinition
metadata:
  id: batteryCharging
  scope: ""
spec:
  label: Battery Voltage
  source:
    keyValue:
      key: "battery_charging"
---
apiVersion: v0.1
kind: DataSourceDefinition
metadata:
  id: nav2Health
  scope: ""
spec:
  label: Nav2 Health
  source:
    # Maps a ROS Diagnostics key-value into an attribute, matched by the diagnostic
    # status name (namespace) plus key. This reads the Nav2 navigation lifecycle
    # manager's health summary, which the diagnostics aggregator already publishes
    # on /diagnostics_agg under the "/Other" group.
    rosDiagnostics:
      namespace: "/Other"
      key: "lifecycle_manager_navigation: Nav2 Health"
---
apiVersion: v0.1
kind: DataSourceDefinition
metadata:
  id: navigationActivity
  scope: ""
spec:
  label: Navigation Activity
  source:
    # The diagnostics_watcher's cmd_vel freshness check, grouped under
    # /Navigation by the aggregator: OK while navigating (cmd_vel flowing),
    # WARN when idle. The value is the check's message, e.g.
    # "last message 0.07s ago" or "last message 163.76s ago (threshold 5.00s)".
    rosDiagnostics:
      namespace: "/Navigation"
      key: "diagnostics_watcher: cmd_vel_freshness"
---
apiVersion: v0.1
kind: DataSourceDefinition
metadata:
  id: message
  scope: ""
spec:
  label: Message
  source:
    keyValue:
      key: "echo"
---
#######################################################################################
## DashboardDefinition
#######################################################################################
apiVersion: v0.1
kind: DashboardDefinition
metadata:
  id: welcome
  scope: ''
spec:
  label: Welcome
  order: 0
  sections:
  - label: ''
    scope: robot
    withControlWidget: false
    widgets:
    - type: text
      label: Welcome
      config:
        text: |
          # Welcome to your first OpenRobOps dashboard
          
          OpenRobOps (ORO) is an open-source robot fleet management and operations platform. 
          It provides real-time observability, monitoring, and control for autonomous mobile robots (AMRs) — fully self-hostable, with native support for ROS and Open RMF.
          Learn more on [https://openrobops.org/](https://openrobops.org/).
      layout:
        chroma: false
        grid: 12
  - label: 'Dashboards'
    scope: robot
    withControlWidget: false
    widgets:
    - type: text
      label: Fleet
      config:
        text: |
          [![fleet](/images/fleet.svg)](/dashboards/fleet)
          
          ### [Fleet](/dashboards/fleet)
          
          Overview of all robots in the fleet, their status and fleet-level diagnostics
          including audit logs and incidents
      layout:
        chroma: false
        grid: 4
    - type: text
      label: Robot
      config:
        text: |
          
          [![robot](/images/bot.svg)](/dashboards/robot)
          
          ### [Robot](/dashboards/robot)
          
          Detailed view of a single robot, including its health, telemetry, reported data, and actions
      layout:
        chroma: false
        grid: 4
    - type: text
      label: Navigation
      config:
        text: |
          [![navigation](/images/navigation.svg)](/dashboards/navigation)
          
          ### [Navigation](/dashboards/navigation)
          
          Real-time navigation status and controls on a map, including teleoperations and relocalize
      layout:
        chroma: false
        grid: 4
  - label: 'Simulation'
    scope: robot
    withControlWidget: false
    widgets:
    - type: text
      label: Map
      config:
        text: |
          ### Flatland simulator
          
          flatland-sim is a simple 2D simulation robot running [ROS2](https://www.ros.org/). It implements the [Flatland](https://github.com/avidbots/flatland) simulator and the [Nav2](https://github.com/ros-navigation/navigation2) navigation stack, providing a realistic simulation of the robot's behavior and navigation. It also implements a battery plugin that simulates the robot's battery state, which drains rather quickly for demo purposes, and recharges when the robot enters a charging zone.
          
          ### Map
          
          The map consists of 4 offices and a corridor. Office A and D have charging zones. 
          
          ```
              ┌─────────────┬─────────────┐
              │        dock │             │
              │      A      │      B      │
              └─────   ─────┴─────   ─────┘
              │         corridor          │
              ┌─────   ─────┬─────   ─────┐
              │      C      │      D      │
              │             │ dock        │
              └─────────────┴─────────────┘
          ```
      layout:
        chroma: false
        grid: 6
    - type: text
      label: Action
      config:
        text: |
          ### Action
          
          Currently the robot accepts the following commands:
          
          **Dock**  
          [DOCK A](/dashboards/ops), [DOCK D](/dashboards/ops): Navigates to the charging zones in office "A" or "D"  
          [DOCK (NEAREST)](/dashboards/ops): Goes to the nearest charging zone
          
          **Battery**  
          [RESET](/dashboards/ops): Replaces the battery to 100%  
          [CHARGING](/dashboards/ops), [DISCHARGING](/dashboards/ops): toggles the charging state
          
          **Message**  
          [HELLO](/dashboards/ops), [MESSAGE](/dashboards/ops): Echoes a message back from the robot as an `echo` key-value  
          [WARNING](/dashboards/ops), [ERROR](/dashboards/ops): Sets the message status, raising an incident visible in Fleet View
          
          **Others**  
          [RESTART AGENT](/dashboards/ops): Restart agent running on a selected robot  
          [CANCEL NAVIGATION](/dashboards/ops): Cancel the current navigation
          
          
          ### Key-value pairs
          
          Additionally, the robot reports key-value pairs as custom data elements, including `battery_charging`, `battery_percentage` and `battery_voltage` for battery state, `estimated_time_remaining` from the nav2 stack, and `echo` for messages echoed back by the Message actions. 
          It also reports a `nav2Health` value collected from ROS Diagnostics.
          These are added to other built-in attributes implemented by the agent such as CPU usage, disk usage, network rate, etc.
      layout:
        chroma: false
        grid: 6
    - type: text
      label: Footer
      config:
        text: |
          This simulation is available on [Github](https://github.com/OpenRobOps/sim-flatland) to be used as a ready-to-run docker environment
          which includes the ORO agent as a sidecar, ready to connect to OpenRobOps.
      layout:
        chroma: false
        grid: 12

---
apiVersion: v0.1
kind: DashboardDefinition
metadata:
  id: fleet
  scope: ''
spec:
  label: Fleet
  order: 1
  sections:
  - label: Fleet
    scope: fleet
    widgets:
    - config:
        statuses:
        - id: cpuLoadPercentage
          label: CPU
        - id: diskUsagePercentage
          label: Disk
        - id: batteryPercentage
          label: Battery
        - id: message
          label: Message
        - id: navigationActivity
          label: Navigation
      label: Fleet Status
      layout:
        chroma: true
        grid: 12
      type: fleetStatus
    withControlWidget: true
  - label: Details
    scope: fleet
    widgets:
    - label: Fleet Log
      layout:
        chroma: true
        grid: 4
        height: 1
      type: auditLogFleet
    - label: Incident List
      layout:
        chroma: true
        grid: 8
        height: 1
      type: incidentList
    - label: Incident Timeline
      layout:
        chroma: true
        grid: 12
        height: 1
      type: incidentTimeline
    withControlWidget: false
---    
apiVersion: v0.1
kind: DashboardDefinition
metadata:
  id: robot
  scope: ''
spec:
  label: Robot
  order: 2
  sections:
  - label: Health
    withControlWidget: true
    scope: robot
    widgets:
    - config:
        dataSources:
        - id: cpuLoadPercentage
          label: CPU usage
          type: gauge
          unit: '%'
        - id: diskUsagePercentage
          label: Disk usage
          type: gauge
          unit: '%'
        - id: batteryPercentage
          label: Battery
          type: gauge
          unit: '%'
        - id: networkOroRate
          label: Agent network rate
          type: gauge
          unit: kbps
      label: Vitals
      layout:
        chroma: true
        grid: 4
        height: 1
      type: vitals
    - label: Data Sources
      type: listData
      layout:
        chroma: true
        grid: 4
        height: 1
      config:
        dataSources:
        - id: batteryCharging
          label: Charging state
          type: boolean
        - id: batteryVoltage
          label: Battery voltage (V)
          unit: V
          type: text
        - id: batteryPercentage
          label: Battery percentage
          unit: "%"
          type: text
        - id: nav2Health
          label: Nav2 health
          type: text
        - id: navigationActivity
          label: Navigation activity
          type: text
    - config: {}
      label: Actions
      layout:
        chroma: true
        grid: 4
        height: 1
      type: actionsWidget
    - label: Key Value pairs
      type: keyValues
      layout:
        chroma: true
        grid: 4
        height: 1
    - type: chart
      label: Battery
      config:
        chartType: linechart
        dataSources:
        - id: batteryPercentage
          label: Batt %
          precision: 1
          scale: 100
        - id: batteryVoltage
          label: Batt V
          precision: 2
          scale: 1
        max: 120
        min: 0
      layout:
        chroma: true
        grid: 8
        height: 1
    - type: diagnostics
      label: Diagnostics
      layout:
        chroma: true
        height: 1
---
apiVersion: v0.1
kind: DashboardDefinition
metadata:
  id: navigation
  scope: ''
spec:
  label: Navigation
  order: 4
  sections:
  - label: Robot Navigation
    withControlWidget: true
    scope: navigation
    widgets:
    - label: Navigation
      layout:
        grid: 12
        height: 2
      type: navigation
---
